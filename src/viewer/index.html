<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Moodle Archive</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1115;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
      }
      header {
        padding: 10px 16px;
        background: #1a1d23;
        border-bottom: 1px solid #2a2d34;
        font-size: 13px;
        word-break: break-all;
      }
      main {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 41px);
      }
      img {
        max-width: 100%;
        max-height: calc(100vh - 41px);
      }
      pre {
        width: 100%;
        height: calc(100vh - 41px);
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
        white-space: pre-wrap;
        word-break: break-word;
        overflow: auto;
        font-size: 13px;
      }
      p {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
